<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pak Askari Education System - Feedback Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        askariGreen: '#15803d',
                        askariDarkGreen: '#115e59',
                        askariNavy: '#1e3a8a',
                        askariGold: '#eab308',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #14532d 50%, #1e3a8a 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="text-slate-800 flex items-center justify-center p-3 sm:p-6 min-h-screen">

    <div class="w-full max-w-2xl glass-card rounded-2xl shadow-2xl overflow-hidden flex flex-col relative border border-white/20">
        
        <header class="bg-gradient-to-r from-askariGreen via-askariNavy to-askariGreen text-white p-3.5 text-center border-b-4 border-askariGold relative shadow-md">
            <div class="flex items-center justify-center space-x-3">
                <div class="text-left">
                    <h1 class="text-xl sm:text-2xl font-extrabold tracking-wide text-white uppercase leading-tight">Pak Askari College</h1>
                    <p class="text-xs text-askariGold font-semibold tracking-wider uppercase">Education System</p>
                </div>
            </div>
        </header>

        <div id="progressBarContainer" class="hidden bg-slate-100 border-b border-slate-200 px-6 py-2.5">
            <div class="flex justify-between items-center text-xs font-semibold text-slate-500 mb-1">
                <span id="progressStepText">Step 1 of 4</span>
                <span id="progressPercentText" class="text-askariGreen font-bold">25%</span>
            </div>
            <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                <div id="progressBarFill" class="bg-gradient-to-r from-askariGreen to-askariNavy h-2 rounded-full transition-all duration-500" style="width: 25%"></div>
            </div>
        </div>

        <main class="flex-1 p-4 sm:p-6 overflow-y-auto">

            <!-- ALREADY SUBMITTED SCREEN -->
            <div id="blockedScreen" class="hidden flex flex-col items-center justify-center text-center py-10 space-y-4">
                <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-4xl shadow-inner">
                    <i class="fa-solid fa-ban"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-askariNavy">Form Already Submitted!</h2>
                <p class="text-sm text-slate-600 max-w-sm mx-auto">Aap is device/browser se pehle hi feedback form fill kar chuke hain. Dobara submission ki ijazat nahi hai.</p>
            </div>

            <!-- SCREEN 1 -->
            <div id="screen1" class="flex flex-col items-center justify-center text-center py-4 space-y-5">
                <div class="space-y-1.5">
                    <h2 class="text-2xl sm:text-3xl font-extrabold text-askariNavy">Welcome in <br/><span class="text-askariGreen">Pak Askari College</span></h2>
                    <p class="text-xs sm:text-sm text-slate-600 max-w-sm mx-auto">Official Student Feedback Portal</p>
                </div>
                <button onclick="goToScreen(2)" class="w-full max-w-xs bg-gradient-to-r from-askariGreen to-askariNavy text-white font-bold py-3.5 px-8 rounded-xl shadow-lg transition-all duration-200 flex items-center justify-center space-x-3 text-lg">
                    <span>ENTER</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <!-- SCREEN 2 -->
            <div id="screen2" class="hidden space-y-5">
                <div class="border-b border-slate-200 pb-3">
                    <h2 class="text-xl font-bold text-askariNavy flex items-center">
                        <i class="fa-solid fa-user-graduate text-askariGreen mr-2.5"></i>
                        Student Information
                    </h2>
                </div>
                <form id="studentForm" onsubmit="handleStudentSubmit(event)" class="
